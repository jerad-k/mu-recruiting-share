
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Share Company Mu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: left;
    }

    .mu-share {
      width: 100%;
      padding-top: 30px;
    }

    .mu-share-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 14px 28px;
      background: #111;
      color: #fff;
      border: 1px solid #111;
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .mu-share-button:hover {
      background: #444;
      color: #fff;
    }

    .mu-share-button:focus-visible {
      outline: 2px solid #555;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      .mu-share {
        padding: 0px 8px 4px 0px;
      }

      .mu-share-button {
        width: 100%;
        max-width: 320px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <section class="mu-share">
    <a
      class="mu-share-button"
      href="https://companymu.earth/pages/recruiting#share"
      target="_blank"
      rel="noopener noreferrer">
      ↗ Share Company Mu
    </a>
  </section>
</body>
</html>
